name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 0 * * *' # nightly UTC
  workflow_dispatch:

jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (fast)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv sync

      - name: Run unit tests
        run: |
          pipenv run python run_tests.py unit

  # integration tests removed: repository will only run fast unit tests on PRs/push.
  # If you later want to re-enable integration tests, add a separate workflow
  # or restore a similar job that installs Playwright and runs `run_tests.py integration`.
