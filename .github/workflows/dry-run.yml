name: Test Run

on:
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install requests playwright

      - name: Install Playwright Browsers # 👈 新增這步安裝瀏覽器核心與系統依賴
        run: |
          python -m pipenv run playwright install --with-deps chromium

      - name: Run DinkUp Bot Test
        env:
          AUTH_JSON_CONTENT: ${{ secrets.AUTH_JSON_CONTENT }}
          PYTHONUNBUFFERED: "1" # 👈 新增這行，讓 log 即時印出
        run: |
          python -m pipenv run python dinkup_bot.py