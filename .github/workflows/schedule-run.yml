name: Schedule Run

on:
  schedule:
    # GitHub cron uses UTC. 00:17 UTC = 08:17 Asia/Taipei; keep a large buffer before noon.
    - cron: '17 0 * * *'
  workflow_dispatch: # 保留手動觸發按鈕方便隨時測試

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install requests playwright

      - name: Install Playwright Browsers
        run: |
          python -m pipenv run playwright install --with-deps chromium

      - name: Run DinkUp Bot Schedule
        env:
          AUTH_JSON_CONTENT: ${{ secrets.AUTH_JSON_CONTENT }}
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
        run: |
          python -m pipenv run python dinkup_bot.py